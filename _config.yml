# Basic Site Settings
locale            : "en-US" # Vous pouvez mettre "fr-FR" si vous préférez un site en français
site_theme        : "default"
title             : "Grégoire Pelletier"
title_separator   : "-"
name              : &name "Grégoire Pelletier"
description       : &description "Portfolio académique de Grégoire Pelletier - Étudiant en Master Mathématiques et Intelligence Artificielle, spécialisé en interprétabilité mécanistique."
url: "https://gregoirepelletier.github.io"
repository: "gregoirepelletier/gregoirepelletier.github.io"

# Jekyll excludes underscore-prefixed directories by default; _pages/*.md
# (cv.md, about.md, markdown.md, ...) needs this to actually be built.
include: ["_pages"]

# Site Author
author:
  # Biographic information
  avatar           : "profile.png" # Pensez à renommer votre photo "profile.png" dans le dossier /images/
  name             : "Grégoire Pelletier"
  pronouns         : "He/Him"
  bio              : "M2 Mathematics and Artificial Intelligence Student @ Paris-Saclay | Research Intern @ EDF R&D (LLM Interpretability & SAE)"
  location         : "Paris, France"
  employer         : "EDF R&D"
  uri              : 
  email            : "gregoire.pelletier80@gmail.com" 

  # Academic websites
  # Laissez vide pour l'instant si vous n'avez pas encore de compte, l'icône n'apparaîtra pas.
  academia         : 
  arxiv            : 
  googlescholar    : 
  orcid            : 
  researchgate     : 

  # Repositories and software development
  github           : "GregoirePelletier"
  kaggle           : "grgoirepelletier"

  # Social media
  linkedin         : "gregoire-pelletier1"
  
# Publication Category (Pour vos futurs articles)
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Analytics (Optionnel : pour voir qui visite votre site)
